<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueryNest — Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        @keyframes blink{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        #srContent pre{background:#0d1117;border:1px solid rgba(107,76,227,0.4);border-radius:10px;padding:16px;margin:10px 0;overflow-x:auto;font-family:'Courier New',monospace;font-size:13px;color:#a5f3fc;white-space:pre;line-height:1.6}
        .code-wrap{margin:10px 0;border-radius:10px;overflow:hidden;border:1px solid rgba(107,76,227,0.4);background:#0d1117}
        .code-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(107,76,227,0.25)}
        .code-bar span{font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:.04em;text-transform:uppercase}
        .code-copy{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.35);color:#c4b5fd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700}
        .code-copy:hover{background:rgba(167,139,250,0.28)}
        .code-copy.ok{background:rgba(16,185,129,0.2);border-color:rgba(16,185,129,0.45);color:#6ee7b7}
        #srContent .code-wrap pre{margin:0;border:none;border-radius:0;padding:16px}
        #srContent code{background:rgba(107,76,227,0.25);padding:2px 7px;border-radius:4px;font-size:12.5px;font-family:monospace;color:#c4b5fd}
        #srContent strong{color:#e2d9f3}
        #srContent::-webkit-scrollbar{width:5px}
        #srContent::-webkit-scrollbar-track{background:transparent}
        #srContent::-webkit-scrollbar-thumb{background:rgba(107,76,227,0.4);border-radius:3px}
        .t-bub{display:flex;align-items:center;gap:4px;padding:12px 16px}
        .t-bub span{width:8px;height:8px;border-radius:50%;background:#a78bfa;display:inline-block;animation:bounce 1.2s infinite ease-in-out}
        .t-bub span:nth-child(2){animation-delay:.2s}.t-bub span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}
        .img-preview-chip{display:none;align-items:center;gap:10px;max-width:900px;margin:10px auto 0;background:rgba(107,76,227,0.15);border:1px solid rgba(107,76,227,0.35);border-radius:12px;padding:8px 12px}
        .img-preview-chip img{width:52px;height:52px;object-fit:cover;border-radius:8px}
        .img-preview-chip span{flex:1;color:#c4b5fd;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .img-preview-chip button{background:none;border:none;color:#f9a8d4;cursor:pointer;font-size:16px}
    </style>
</head>
<body>
<div class="bg-animation"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>
<div class="content">
  <nav>
    <div class="nav-container">
      <div class="logo" onclick="location.href='/home'" style="cursor:pointer">🔍 QueryNest</div>
      <div class="nav-tabs">
        <div class="nav-tab active" data-lang="" onclick="switchTab(this,'')">All</div>
        <div class="nav-tab" data-lang="sql" onclick="switchTab(this,'sql')">SQL</div>
        <div class="nav-tab" data-lang="mysql" onclick="switchTab(this,'mysql')">MySQL</div>
        <div class="nav-tab" data-lang="mongodb" onclick="switchTab(this,'mongodb')">MongoDB</div>
        <div class="nav-tab" data-lang="python" onclick="switchTab(this,'python')">Python</div>
        <div class="nav-tab" data-lang="java" onclick="switchTab(this,'java')">Java</div>
        <div class="nav-tab" data-lang="c" onclick="switchTab(this,'c')">C</div>
        <div class="nav-tab" data-lang="cpp" onclick="switchTab(this,'cpp')">C++</div>
      </div>
      <div class="nav-right">
        <button class="btn-back" onclick="location.href='/home-premium'" style="background:linear-gradient(135deg,#6b4ce3,#ec4899);color:#fff;border:none;font-weight:700;">🤖 AI Assistant</button>
        <button class="btn-back" onclick="location.href='/ide'" style="background:linear-gradient(135deg,#6b4ce3,#ec4899);color:#fff;border:none;font-weight:700;">🖥️ IDE</button>
        <button class="btn-back" onclick="location.href='/home-premium'">← Back</button>
        <div class="user-info">Hello, <strong id="nav-user">User</strong></div>
        <button class="btn-logout" onclick="location.href='/logout'">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Query Search</h1>
      <p>Code &amp; database queries — results on this page</p>
      <div class="header-subtitle">🔍 Search here · 🤖 Chat AI Assistant page par hai</div>
    </div>

    <div class="search-section">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search queries... e.g. 'create house table'">
        <input type="file" id="searchImage" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" style="display:none">
        <button id="searchImgBtn" title="Image se search" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px 8px;color:#a78bfa;vertical-align:middle;">📎</button>
        <button id="searchMicBtn" title="Voice search — Hindi ya English bolein" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px 8px;color:#a78bfa;vertical-align:middle;">🎤</button>
        <button class="btn-search" onclick="doSearch()">Search</button>
      </div>
      <div class="img-preview-chip" id="searchImgChip">
        <img id="searchImgThumb" alt="preview">
        <span id="searchImgName">image</span>
        <button type="button" onclick="clearSearchImage()" title="Remove">✕</button>
      </div>
    </div>

    <div id="srPanel" style="display:none;max-width:900px;margin:0 auto 40px;animation:fadeIn .3s ease;">
      <div style="background:rgba(22,4,40,0.97);border:2px solid rgba(107,76,227,0.4);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.5);">
        <div style="background:linear-gradient(135deg,rgba(107,76,227,0.25),rgba(168,85,247,0.15));border-bottom:1px solid rgba(107,76,227,0.25);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="display:flex;align-items:center;gap:10px;min-width:0;">
            <div id="srIcon" style="font-size:20px;flex-shrink:0;">📖</div>
            <div id="srTitle" style="font-size:16px;font-weight:800;color:#e2d9f3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span id="srSourceBadge" style="font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(107,76,227,0.3);color:#c4b5fd;letter-spacing:.05em;"></span>
            <button onclick="copySrCode()" title="Copy code" style="background:rgba(255,255,255,0.07);border:1px solid rgba(107,76,227,0.3);color:#a78bfa;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;">📋 Copy</button>
            <button onclick="document.getElementById('srPanel').style.display='none'" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#a78bfa;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:14px;">✕</button>
          </div>
        </div>
        <div id="srContent" style="padding:22px;color:#c4b5fd;font-size:14px;line-height:1.85;max-height:60vh;overflow-y:auto;"></div>
        <div id="srFooter" style="border-top:1px solid rgba(107,76,227,0.2);padding:12px 20px;display:none;align-items:center;gap:10px;background:rgba(0,0,0,0.2);">
          <span style="color:rgba(200,180,255,0.4);font-size:12px;flex:1;">Aur detail chahiye?</span>
          <button id="srAskAI" onclick="askAIFromSearch()" style="background:linear-gradient(135deg,#6b4ce3,#a855f7);border:none;color:#fff;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;">🤖 AI se poochho</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/voice-input.js"></script>
<script>
var curLang = '';
var _lastSearchQuery = '';
var pendingSearchImage = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(text){
  var codeBlocks = [];
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_,l,c){
    var placeholder = '___CODEBLOCK_' + codeBlocks.length + '___';
    var label = (l || 'code').toUpperCase();
    var cleanCode = c.replace(/\r\n/g, '\n').replace(/^\n+|\s+$/g, '');
    var html = '<div class="code-wrap">'
      + '<div class="code-bar"><span>'+esc(label)+'</span>'
      + '<button type="button" class="code-copy" onclick="copyCodeBlock(this)">📋 Copy</button></div>'
      + '<pre>'+esc(cleanCode)+'</pre></div>';
    codeBlocks.push(html);
    return placeholder;
  });
  text = text.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  text = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g,'<em>$1</em>');
  text = text.replace(/\n/g,'<br>');
  text = text.replace(/___CODEBLOCK_(\d+)___/g, function(_, idx){
    return codeBlocks[Number(idx)];
  });
  return text;
}
function copyCodeBlock(btn){
  var wrap = btn && btn.closest ? btn.closest('.code-wrap') : null;
  var pre = wrap ? wrap.querySelector('pre') : null;
  if (!pre) return;
  var text = '';
  if (pre.querySelector('br')) {
    var clone = pre.cloneNode(true);
    clone.querySelectorAll('br').forEach(function(br){ br.replaceWith('\n'); });
    text = clone.textContent || '';
  } else {
    text = pre.textContent || '';
  }
  text = text.replace(/\r\n/g, '\n');
  if (!text) return;
  var done = function(){
    btn.classList.add('ok');
    var orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(function(){ btn.textContent = orig; btn.classList.remove('ok'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text);
    done();
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

function switchTab(el, lang){
  curLang = lang || '';
  document.querySelectorAll('.nav-tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  var q = document.getElementById('searchInput').value.trim();
  if (q || pendingSearchImage) doSearch();
}

function fileToImagePayload(file){
  return new Promise(function(resolve, reject){
    if (!file) { resolve(null); return; }
    var ok = /image\/(png|jpe?g|webp|gif)/i.test(file.type);
    if (!ok) { reject(new Error('Sirf PNG, JPG, WEBP ya GIF chalegi.')); return; }
    if (file.size > 4 * 1024 * 1024) { reject(new Error('Image 4MB se chhoti honi chahiye.')); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = String(reader.result || '');
      var parts = dataUrl.split(',');
      resolve({
        mime: file.type,
        data: parts[1] || '',
        name: file.name,
        preview: dataUrl
      });
    };
    reader.onerror = function(){ reject(new Error('Image read nahi hui.')); };
    reader.readAsDataURL(file);
  });
}

function showSearchImage(img){
  pendingSearchImage = img;
  var chip = document.getElementById('searchImgChip');
  document.getElementById('searchImgThumb').src = img.preview;
  document.getElementById('searchImgName').textContent = img.name || 'image attached';
  chip.style.display = 'flex';
}
function clearSearchImage(){
  pendingSearchImage = null;
  document.getElementById('searchImage').value = '';
  document.getElementById('searchImgChip').style.display = 'none';
}

function doSearch(useAI){
  var raw = document.getElementById('searchInput').value.trim();
  var q = (typeof QNVoice !== 'undefined' && QNVoice.isDevanagari && QNVoice.isDevanagari(raw))
        ? QNVoice.translateToEnglish(raw) : raw;
  if (!q && !pendingSearchImage) return;
  if (!q && pendingSearchImage) q = 'Is image se related complete working code / SQL query do';
  _lastSearchQuery = q;
  var forceAI = useAI === true || !!pendingSearchImage;

  var srPanel   = document.getElementById('srPanel');
  var srTitle   = document.getElementById('srTitle');
  var srContent = document.getElementById('srContent');
  var srIcon    = document.getElementById('srIcon');
  var srBadge   = document.getElementById('srSourceBadge');
  var srFooter  = document.getElementById('srFooter');

  srIcon.textContent    = forceAI ? '🤖' : '🔍';
  srTitle.textContent   = forceAI ? 'AI soch raha hai...' : 'Searching database...';
  srBadge.textContent   = forceAI ? 'AI' : 'Searching...';
  srFooter.style.display = 'none';
  srContent.innerHTML   = '<div style="display:flex;align-items:center;gap:12px;padding:8px 0;">'
    + '<div class="t-bub" style="display:inline-flex;gap:5px;"><span></span><span></span><span></span></div>'
    + '<span style="color:rgba(200,180,255,0.5);font-size:13px;">' + (forceAI ? 'AI generating answer...' : 'Looking through database...') + '</span></div>';
  srPanel.style.display = 'block';
  srPanel.scrollIntoView({behavior:'smooth', block:'nearest'});

  var payload = {query: q, lang: curLang||'', use_ai: forceAI};
  if (pendingSearchImage) {
    payload.image = { mime: pendingSearchImage.mime, data: pendingSearchImage.data };
  }

  fetch('/api/search', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    credentials: 'include',
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!forceAI && (d.source==='not_found' || !d.success || (d.result && !d.result.content))) {
      srIcon.textContent  = '🤖';
      srTitle.textContent = 'AI se poochh raha hoon...';
      srBadge.textContent = 'AI';
      srContent.innerHTML = '<div style="color:rgba(200,180,255,0.5);font-size:13px;padding:8px 0;">Database mein nahi mila — AI se puchh raha hoon... ✨</div>';
      doSearch(true);
      return;
    }
    var sourceLabel = {
      'database':   '📊 Database',
      'local_json': '📁 Library',
      'builtin':    '⚡ Built-in',
      'ai':         '🤖 AI Generated',
      'claude_ai':  '🤖 Claude AI'
    }[d.source] || (forceAI ? '🤖 AI' : '📖 Found');

    srBadge.textContent   = sourceLabel;
    srIcon.textContent    = forceAI ? '🤖' : '✅';

    if (d.result && d.result.content) {
      srTitle.textContent = d.result.title || q;
      srContent.innerHTML = fmt(d.result.content);
      srFooter.style.display = 'flex';
    } else if (d.success === false && d.message) {
      srIcon.textContent  = '❌';
      srTitle.textContent = 'Result nahi mila';
      srBadge.textContent = '';
      srContent.innerHTML = '<div style="color:rgba(220,200,255,0.75);font-size:14px;padding:4px 0;">'
        + fmt(d.message)
        + '</div><div style="margin-top:14px;">'
        + '<button onclick="askAIFromSearch()" style="background:linear-gradient(135deg,#6b4ce3,#a855f7);border:none;color:#fff;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;">🤖 AI se puchho</button></div>';
    } else {
      srTitle.textContent = q;
      srContent.innerHTML = '<div style="color:rgba(220,200,255,0.7);font-size:14px;">Koi result nahi mila.</div>';
      srFooter.style.display = 'flex';
    }
  })
  .catch(function(err){
    srIcon.textContent  = '⚠️';
    srTitle.textContent = 'Error';
    srContent.innerHTML = '<div style="color:#f87171;font-size:13px;">Connection error: ' + String(err) + '</div>';
  });
}

function askAIFromSearch() {
  if (!_lastSearchQuery) return;
  var url = '/home-premium?ask=' + encodeURIComponent(_lastSearchQuery);
  if (curLang) url += '&lang=' + encodeURIComponent(curLang);
  location.href = url;
}

function copySrCode() {
  var content = document.getElementById('srContent');
  var pre = content ? content.querySelector('pre') : null;
  var text = pre ? pre.textContent : (content ? content.innerText : '');
  if (!text) return;
  navigator.clipboard.writeText(text).then(function(){
    var btn = event.target;
    var orig = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    btn.style.color = '#22c55e';
    setTimeout(function(){ btn.innerHTML = orig; btn.style.color = ''; }, 1800);
  }).catch(function(){});
}

document.getElementById('searchInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') doSearch();
});

document.getElementById('searchImgBtn').onclick = function(){
  document.getElementById('searchImage').click();
};
document.getElementById('searchImage').addEventListener('change', function(){
  var file = this.files && this.files[0];
  if (!file) return;
  fileToImagePayload(file).then(showSearchImage).catch(function(err){
    alert(err.message || String(err));
    clearSearchImage();
  });
});
document.getElementById('searchInput').addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') === 0) {
      e.preventDefault();
      var file = items[i].getAsFile();
      fileToImagePayload(file).then(showSearchImage).catch(function(err){ alert(err.message || String(err)); });
      break;
    }
  }
});

document.addEventListener('DOMContentLoaded', function() {
  if (document.getElementById('searchMicBtn')) {
    QNVoice.init('searchMicBtn', 'searchInput', {
      onResult: function(){ setTimeout(function(){ doSearch(); }, 300); }
    });
  }
  var params = new URLSearchParams(location.search);
  var q = params.get('q') || '';
  var lang = (params.get('lang') || '').toLowerCase();
  if (lang) {
    curLang = lang;
    document.querySelectorAll('.nav-tab').forEach(function(t){
      t.classList.toggle('active', (t.getAttribute('data-lang') || '') === lang);
    });
  }
  if (q) {
    document.getElementById('searchInput').value = q;
    doSearch();
  }
});

fetch('/api/me',{credentials:'include'})
  .then(function(r){return r.json();})
  .then(function(d){if(d.success&&d.user){var e=document.getElementById('nav-user');if(e)e.textContent=d.user.name;}})
  .catch(function(){});
</script>
</body>
</html>
